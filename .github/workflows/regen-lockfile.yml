name: regen-lockfile-fast-uri
on:
  workflow_dispatch:
  push:
    branches: [fix/fast-uri-dependabot-v2]
    paths:
      - package.json
      - .github/workflows/regen-lockfile.yml
permissions:
  contents: write
jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Refresh lockfile with overrides
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify fast-uri patched
        run: python3 -c "import json; e=json.load(open('package-lock.json'))['packages']['node_modules/fast-uri']; print(e); assert e['version']=='3.1.7', e"
      - name: Commit lockfile if changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then echo No-lockfile-changes; exit 0; fi
          git commit -m "fix(deps): refresh package-lock.json for fast-uri 3.1.7"
          git push
